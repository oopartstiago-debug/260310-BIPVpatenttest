# AI Tilt — ML-Agents PPO 트레이너 설정
# behavior name은 Unity BehaviorParameters의 "LouverTilt"와 반드시 일치해야 함.
# 실행:  mlagents-learn rl/config/louver_ppo.yaml --run-id=louver01
#        (그 다음 Unity 에디터에서 ▶ Play — BehaviorType=Default 여야 트레이너에 연결됨)
behaviors:
  LouverTilt:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3            # 엔트로피 보너스(탐험). 정책이 너무 빨리 한 각으로 굳으면 키울 것.
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true         # 관측 자동 정규화(태양/지오메트리 스케일 차이 흡수)
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99           # 하루(120스텝) 누적을 보게 높게
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 5000000   # max_steps보다 크게 → 진행 중 onnx export 시도 안 함(의존성 충돌 회피)
    max_steps: 3000000        # 1차 학습 기준(보상곡선 보고 조정)
    time_horizon: 128         # 에피소드(=하루) 길이와 비슷하게
    summary_freq: 10000
# 참고:
#  · 보상곡선(Environment/Cumulative Reward)이 우상향하면 학습 진행 중.
#  · 평가 지표는 HUD의 "하루 추종률(oracle 상한 대비 %)" — 90%+면 양호.
#  · 학습이 평평하면: domainRandomize 범위 축소(쉬운 커리큘럼) 또는 wMotor 낮춤.
